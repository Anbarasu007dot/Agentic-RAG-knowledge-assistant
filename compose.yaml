services:
  postgres:
    image: postgres:17-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_DB: agentic_rag
      POSTGRES_USER: agentic_rag
      POSTGRES_PASSWORD: agentic_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_rag -d agentic_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
    container_name: rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agentic_rag:agentic_rag@postgres:5432/agentic_rag
    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    develop:
      watch:
        # Sync FastAPI source code
        - action: sync
          path: ./app
          target: /app/app

        # Sync documents
        - action: sync
          path: ./documents
          target: /app/documents

        # Rebuild if dependencies change
        - action: rebuild
          path: requirements.txt

        # Rebuild if Dockerfile changes
        - action: rebuild
          path: Dockerfile

  frontend:
    build:
      context: ./frontend
    container_name: rag-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

    develop:
      watch:
        # Sync React source
        - action: sync
          path: ./frontend/src
          target: /app/src

        # Sync public folder
        - action: sync
          path: ./frontend/public
          target: /app/public

        # Rebuild if package.json changes
        - action: rebuild
          path: ./frontend/package.json

        # Rebuild if Dockerfile changes
        - action: rebuild
          path: ./frontend/Dockerfile

volumes:
  postgres_data:
